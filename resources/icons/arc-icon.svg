<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Database cylinder -->
  <ellipse cx="50" cy="30" rx="30" ry="10" fill="url(#arcGradient)" opacity="0.8"/>
  <rect x="20" y="30" width="60" height="40" fill="url(#arcGradient)" opacity="0.9"/>
  <ellipse cx="50" cy="70" rx="30" ry="10" fill="url(#arcGradient)"/>

  <!-- Arc/wave effect -->
  <path d="M 25 45 Q 35 35, 50 40 T 75 45" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 25 55 Q 35 48, 50 52 T 75 55" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Highlight -->
  <ellipse cx="50" cy="30" rx="20" ry="6" fill="#FFFFFF" opacity="0.3"/>
</svg>
